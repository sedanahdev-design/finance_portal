{% extends "base.html" %}
{% block title %}{{ module.name }}{% endblock %}
{% block page_title %}{{ module.name }}{% endblock %}
{% block content %}
<div class="card-surface text-center py-5">
  <div class="module-icon mx-auto mb-3" style="background: {{ module.color }};"><i class="bi {{ module.icon }}"></i></div>
  <h3 class="fw-bold">{{ module.name }}</h3>
  <p class="text-muted mx-auto" style="max-width:520px;">{{ module.description }}</p>
  <span class="status-pill status-warn mt-2"><i class="bi bi-tools"></i> هذه الوحدة قيد الإنشاء ضمن خطة البناء التدريجي</span>
</div>
{% endblock %}
